<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Cloud</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fbfcfd;
    color: #2b3440;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
  }

  /* ==================== SIDEBAR ==================== */
  aside {
    background: #ffffff;
    border-right: 1px solid #e9eef2;
    padding: 24px 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #1A6B6B;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.2px;
  }
  .brand svg { flex-shrink: 0; }

  .block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .block label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #6b7a87;
  }

  textarea#text {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 12px 14px;
    font: 0.92rem/1.5 'Segoe UI', Tahoma, sans-serif;
    color: #2b3440;
    background: #fbfcfd;
    border: 1px solid #dce4ea;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  textarea#text:focus {
    border-color: #2A9D8F;
    background: #ffffff;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .ctl {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ctl small {
    font-size: 0.7rem;
    color: #8693a0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  select, input[type="number"], input[type="range"] {
    width: 100%;
    padding: 9px 10px;
    font: 0.88rem 'Segoe UI', Tahoma, sans-serif;
    color: #2b3440;
    background: #fbfcfd;
    border: 1px solid #dce4ea;
    border-radius: 8px;
    outline: none;
    cursor: pointer;
  }
  select:focus, input:focus { border-color: #2A9D8F; }

  input[type="range"] {
    padding: 0;
    height: 32px;
    cursor: pointer;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    color: #3c4a58;
    cursor: pointer;
    user-select: none;
  }
  .toggle-row input { width: auto; cursor: pointer; accent-color: #2A9D8F; }

  button.primary {
    background: linear-gradient(135deg, #2A9D8F 0%, #1A6B6B 100%);
    color: white;
    border: none;
    padding: 12px 18px;
    font: 700 0.92rem 'Segoe UI', Tahoma, sans-serif;
    letter-spacing: 0.5px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 2px 8px rgba(42, 157, 143, 0.25);
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(42, 157, 143, 0.35); }
  button.primary:active { transform: translateY(0); }

  button.ghost {
    background: white;
    color: #1A6B6B;
    border: 1px solid #c7d6db;
    padding: 8px 12px;
    font: 600 0.84rem 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button.ghost:hover { background: #f4faf9; border-color: #2A9D8F; }

  .sidebar-foot {
    margin-top: auto;
    font-size: 0.72rem;
    color: #9ba7b2;
    padding-top: 12px;
    border-top: 1px solid #eef2f5;
  }

  /* ==================== MAIN ==================== */
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: #ffffff;
    border-bottom: 1px solid #eef2f5;
    gap: 12px;
    flex-wrap: wrap;
  }
  .main-bar .stats {
    display: flex;
    gap: 14px;
    font-size: 0.82rem;
    color: #6b7a87;
    font-weight: 500;
  }
  .main-bar .stats b {
    color: #1A6B6B;
    font-weight: 700;
    margin-right: 4px;
  }
  .main-bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  #stage {
    flex: 1;
    position: relative;
    background:
      radial-gradient(circle at 20% 20%, rgba(42, 157, 143, 0.04) 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(212, 168, 67, 0.04) 0%, transparent 45%),
      #fbfcfd;
    overflow: hidden;
  }
  #stage svg { display: block; margin: 0 auto; max-width: 100%; }
  #stage text {
    cursor: default;
    transition: filter 0.15s;
  }
  #stage text:hover {
    filter: brightness(0.85);
  }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b6c1ca;
    font-size: 1.1rem;
    pointer-events: none;
    text-align: center;
    padding: 40px;
    letter-spacing: 0.2px;
  }
  #empty span { font-weight: 500; }

  /* ==================== TOOLTIP ==================== */
  #tip {
    position: fixed;
    background: #1A6B6B;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.12s, transform 0.12s;
    z-index: 1000;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.14);
  }
  #tip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: #1A6B6B;
    border-bottom: 0;
  }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tip b { font-size: 0.95rem; margin-right: 6px; }

  /* ==================== FULLSCREEN ==================== */
  main:fullscreen { background: #fbfcfd; }
  main:fullscreen .main-bar {
    position: absolute;
    top: 16px;
    right: 16px;
    left: 16px;
    border: none;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 10px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    z-index: 10;
  }
  main:fullscreen #stage { padding-top: 60px; }

  /* Hide sidebar when main is fullscreen - main is its own root when fullscreen */

  @media (max-width: 900px) {
    aside { padding: 18px 16px; }
    .main-bar { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="shell">

  <aside>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 40 40">
        <polygon points="13,2 24,13 13,24 2,13" fill="#2A9D8F" opacity="0.85"/>
        <polygon points="27,2 38,13 27,24 16,13" fill="#D4A843" opacity="0.85"/>
        <polygon points="13,16 24,27 13,38 2,27" fill="#E65C3C" opacity="0.85"/>
        <polygon points="27,16 38,27 27,38 16,27" fill="#7A2D4E" opacity="0.85"/>
      </svg>
      Word Cloud
    </div>

    <div class="block">
      <label for="text">Paste text</label>
      <textarea id="text" placeholder="Paste hundreds of words here... responses, essays, transcripts, anything."></textarea>
    </div>

    <div class="row">
      <div class="ctl">
        <small>Layout</small>
        <select id="layout">
          <option value="rect">Rectangle</option>
          <option value="circle">Circle</option>
          <option value="loose">Loose</option>
          <option value="tight">Tight</option>
        </select>
      </div>
      <div class="ctl">
        <small>Palette</small>
        <select id="palette">
          <option value="teal">Teal</option>
          <option value="ocean">Ocean</option>
          <option value="warm">Warm</option>
          <option value="mono">Mono</option>
          <option value="rainbow">Rainbow</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="ctl">
        <small>Font</small>
        <select id="font">
          <option value="Segoe UI">Sans</option>
          <option value="Georgia">Serif</option>
          <option value="Comfortaa, Segoe UI">Rounded</option>
          <option value="Courier New">Mono</option>
        </select>
      </div>
      <div class="ctl">
        <small>Max words</small>
        <input type="number" id="maxWords" value="120" min="10" max="400" step="10">
      </div>
    </div>

    <div class="ctl">
      <small>Min word frequency: <span id="minCountLabel">1</span></small>
      <input type="range" id="minCount" min="1" max="10" value="1">
    </div>

    <label class="toggle-row">
      <input type="checkbox" id="removeStopwords" checked>
      Remove common words (a, the, and, is...)
    </label>

    <label class="toggle-row">
      <input type="checkbox" id="caseInsensitive" checked>
      Treat "The" and "the" as same word
    </label>

    <button class="primary" id="go">Generate cloud</button>

    <div class="sidebar-foot">Hover a word for its count. Click Generate after changing settings.</div>
  </aside>

  <main id="main">
    <div class="main-bar">
      <div class="stats">
        <span><b id="sTotal">0</b>words</span>
        <span><b id="sUnique">0</b>unique</span>
        <span><b id="sShown">0</b>shown</span>
      </div>
      <div class="actions">
        <button class="ghost" id="fsBtn">Fullscreen</button>
        <button class="ghost" id="jpgBtn">JPG</button>
        <button class="ghost" id="pdfBtn">PDF</button>
      </div>
    </div>
    <div id="stage">
      <div id="empty"><span>Paste text, hit Generate, and your cloud will appear here.</span></div>
    </div>
  </main>

</div>

<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.7/build/d3.layout.cloud.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
// ============== STOPWORDS (standard English set, ~180) ==============
const STOPWORDS = new Set((
  "a about above after again against all am an and any are aren't as at be because been before being below between both but by can can't cannot could couldn't did didn't do does doesn't doing don't down during each few for from further had hadn't has hasn't have haven't having he he'd he'll he's her here here's hers herself him himself his how how's i i'd i'll i'm i've if in into is isn't it it's its itself let's me more most mustn't my myself no nor not of off on once only or other ought our ours ourselves out over own same shan't she she'd she'll she's should shouldn't so some such than that that's the their theirs them themselves then there there's these they they'd they'll they're they've this those through to too under until up very was wasn't we we'd we'll we're we've were weren't what what's when when's where where's which while who who's whom why why's with won't would wouldn't you you'd you'll you're you've your yours yourself yourselves also just like get got one two three really actually thing things way many much even still yet now never always often just"
).split(/\s+/));

// ============== PALETTES ==============
const PALETTES = {
  teal:    ["#1A6B6B","#2A9D8F","#3DB8A6","#70C7B9","#a9d6cd"],
  ocean:   ["#1B3A5C","#2E5C8A","#4681B5","#6FA8D6","#a9c7e0"],
  warm:    ["#7A2D4E","#b8432a","#E65C3C","#D4A843","#e8c379"],
  mono:    ["#2b3440","#4e5865","#6b7a87","#8a98a5","#b6c1ca"],
  rainbow: ["#1A6B6B","#2A9D8F","#D4A843","#E65C3C","#7A2D4E","#2E5C8A"]
};

// ============== ELEMENTS ==============
const $ = id => document.getElementById(id);
const text=$('text'), layout=$('layout'), palette=$('palette'), font=$('font'),
      maxWords=$('maxWords'), minCount=$('minCount'), minCountLabel=$('minCountLabel'),
      removeStopwords=$('removeStopwords'), caseInsensitive=$('caseInsensitive'),
      go=$('go'), stage=$('stage'), empty=$('empty'),
      sTotal=$('sTotal'), sUnique=$('sUnique'), sShown=$('sShown'),
      fsBtn=$('fsBtn'), jpgBtn=$('jpgBtn'), pdfBtn=$('pdfBtn'),
      mainEl=$('main'), tip=$('tip');

minCount.addEventListener('input', ()=> minCountLabel.textContent = minCount.value);

// ============== TOKENIZE ==============
function tokenize(raw) {
  let s = raw || '';
  if (caseInsensitive.checked) s = s.toLowerCase();
  const tokens = s.match(/[\p{L}][\p{L}\p{M}'-]*/gu) || [];
  return tokens;
}

function counts(tokens) {
  const map = new Map();
  const useStop = removeStopwords.checked;
  for (const t of tokens) {
    const key = t.replace(/^['-]+|['-]+$/g,'');
    if (!key || key.length < 2) continue;
    if (useStop && STOPWORDS.has(key.toLowerCase())) continue;
    map.set(key, (map.get(key) || 0) + 1);
  }
  return map;
}

// ============== DRAW ==============
let currentWords = [];

function draw() {
  const raw = text.value;
  const tokens = tokenize(raw);
  const map = counts(tokens);

  sTotal.textContent = tokens.length.toLocaleString();
  sUnique.textContent = map.size.toLocaleString();

  const minC = parseInt(minCount.value, 10);
  const maxW = Math.max(10, Math.min(400, parseInt(maxWords.value, 10) || 120));

  let arr = [...map.entries()]
    .filter(([, c]) => c >= minC)
    .sort((a,b) => b[1]-a[1])
    .slice(0, maxW)
    .map(([text, size]) => ({ text, size }));

  sShown.textContent = arr.length.toLocaleString();

  // Clear
  stage.querySelectorAll('svg').forEach(n => n.remove());

  if (!arr.length) {
    empty.style.display = 'flex';
    empty.querySelector('span').textContent = raw.trim()
      ? 'No words to show. Try lowering the min frequency.'
      : 'Paste text, hit Generate, and your cloud will appear here.';
    return;
  }
  empty.style.display = 'none';

  // Scale font size from counts
  const maxCount = arr[0].size;
  const minCountVal = arr[arr.length - 1].size;
  const scale = d3.scaleLinear()
    .domain([minCountVal, maxCount])
    .range([14, 96]);

  currentWords = arr.map(w => ({ ...w, count: w.size, size: scale(w.size) }));

  const w = Math.max(400, stage.clientWidth - 40);
  const h = Math.max(400, stage.clientHeight - 40);
  const lay = layout.value;
  const spiral = lay === 'circle' ? 'archimedean' : 'rectangular';
  const padding = lay === 'loose' ? 6 : lay === 'tight' ? 1 : 3;

  const palKey = palette.value;
  const pal = PALETTES[palKey] || PALETTES.teal;
  const fontFam = font.value;

  d3.layout.cloud()
    .size([w, h])
    .words(currentWords)
    .padding(padding)
    .rotate(() => (Math.random() < 0.25 ? (Math.random() < 0.5 ? -90 : 90) : 0))
    .spiral(spiral)
    .font(fontFam.split(',')[0].trim())
    .fontSize(d => d.size)
    .on('end', drawWords)
    .start();

  function drawWords(placed) {
    const svg = d3.select(stage).append('svg')
      .attr('width', w)
      .attr('height', h)
      .attr('viewBox', `0 0 ${w} ${h}`)
      .attr('id', 'cloudSvg');

    const g = svg.append('g').attr('transform', `translate(${w/2},${h/2})`);

    g.selectAll('text')
      .data(placed)
      .enter().append('text')
        .style('font-family', fontFam)
        .style('font-weight', '700')
        .style('fill', (d,i) => pal[i % pal.length])
        .attr('text-anchor', 'middle')
        .attr('transform', d => `translate(${d.x},${d.y})rotate(${d.rotate})`)
        .style('font-size', d => d.size + 'px')
        .text(d => d.text)
        .on('mousemove', (e,d) => {
          tip.innerHTML = `<b>${d.text}</b> ${d.count}`;
          tip.style.left = (e.clientX - tip.offsetWidth/2) + 'px';
          tip.style.top = (e.clientY - tip.offsetHeight - 12) + 'px';
          tip.classList.add('show');
        })
        .on('mouseleave', () => tip.classList.remove('show'));
  }
}

go.addEventListener('click', draw);
window.addEventListener('resize', () => { if (currentWords.length) draw(); });

// ============== FULLSCREEN ==============
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    mainEl.requestFullscreen?.().catch(()=>{}) || mainEl.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
});
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
  if (currentWords.length) setTimeout(draw, 120);
});

// ============== EXPORT ==============
async function renderCanvas() {
  if (!currentWords.length) return null;
  const node = stage;
  return await html2canvas(node, {
    backgroundColor: '#fbfcfd',
    scale: 2,
    logging: false,
    useCORS: true
  });
}

jpgBtn.addEventListener('click', async () => {
  const canvas = await renderCanvas();
  if (!canvas) { alert('Generate a cloud first.'); return; }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'word-cloud.jpg';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1200);
  }, 'image/jpeg', 0.95);
});

pdfBtn.addEventListener('click', async () => {
  const canvas = await renderCanvas();
  if (!canvas) { alert('Generate a cloud first.'); return; }
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: canvas.width >= canvas.height ? 'landscape' : 'portrait',
    unit: 'pt',
    format: [canvas.width, canvas.height]
  });
  pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
  pdf.save('word-cloud.pdf');
});

// ============== STARTER TEXT (helpful default sample) ==============
text.value = `Paste or type any text here — student responses, a transcript, an essay — and hit Generate.

The cloud sizes each word by how often it appears. Hover over any word to see its exact count. Try different layouts, palettes, and fonts. Export as JPG or PDF when it looks how you want.

The cloud handles hundreds to thousands of words. Common words like the, a, and, is, it are filtered out by default. You can turn that off.`;
</script>
</body>
</html>
